<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Novel Reader options</title>
<style>
  :root { --paper: #f1eadc; --ink: #241a12; --muted: #6b5f53; --accent: #c4685a; }
  @media (prefers-color-scheme: dark) { :root { --paper: #19120e; --ink: #efe7d8; --muted: #9d9388; --accent: #e89f92; } }
  body { background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, sans-serif; max-width: 34rem; margin: 2rem auto; padding: 0 16px; }
  label { display: block; color: var(--muted); margin: 1rem 0 .4rem; }
  input { width: 100%; box-sizing: border-box; font: inherit; padding: 8px 10px; border: 1.5px solid var(--muted); border-radius: 4px; background: transparent; color: var(--ink); }
  input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button { margin-top: 1rem; font: 600 15px system-ui, sans-serif; padding: 9px 18px; border: 0; border-radius: 999px; background: var(--accent); color: #19120e; cursor: pointer; }
  p { color: var(--muted); }
</style></head>
<body>
  <h1>Novel Reader</h1>
  <p>The toolbar button reads the current PDF or web page aloud in the Reader. Books and settings live in the Reader site, the same as on your phone's browser.</p>
  <label for="u">Reader address</label>
  <input id="u" type="url" placeholder="https://aikiesan.github.io/webnovel_reader/">
  <button id="save" type="button">Save</button> <span id="ok"></span>
  <p>To read PDFs saved on this computer: chrome://extensions, Details under Novel Reader, turn on "Allow access to file URLs".</p>
  <script src="options.js"></script>
</body>
</html>
